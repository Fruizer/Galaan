<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/galaan-icon.svg" />
    <link rel="apple-touch-icon" href="/galaan-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f1f1eb" />
    <script>
      try {
        const savedTheme = localStorage.getItem('galaan-theme-v1')
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        if (savedTheme === 'dark' || (!savedTheme && prefersDark)) document.documentElement.dataset.theme = 'dark'
      } catch {}
    </script>
    <meta name="description" content="Make time for your people. Plan galas, RSVP with a pirma, and keep your barkada in sync." />
    <title>Galaan — Make time for your people</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
